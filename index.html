<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wedding RSVP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Floating Music Toggle Button -->
  <div id="musicPlayer">
    <span id="playIcon">🎵</span>
    <span id="musicText">Play Music</span>
  </div>

  <!-- Hidden Audio Element linked to GitHub Raw File -->
  <audio id="bgMusic" autoplay loop>
    <source src="https://raw.githubusercontent.com/pocotacojpn/wedding-rsvp/refs/heads/main/wedding_1.mp3" type="audio/mp3">
    Your browser does not support the audio element.
  </audio>

  <div class="container">
    <h1>Celebration of Love</h1>
    <p class="subtitle">Please RSVP by filling out the form below</p>

    <form id="rsvpForm">
      <div class="form-group">
        <label for="name">Your Full Name</label>
        <input type="text" id="name" name="name" required placeholder="e.g. Jane Doe">
      </div>

      <div class="form-group">
        <label for="attending">Will you be attending?</label>
        <select id="attending" name="attending" required>
          <option value="">-- Please Select --</option>
          <option value="Yes">Joyfully Accepts</option>
          <option value="No">Regretfully Declines</option>
        </select>
      </div>

      <div class="form-group">
        <label for="noOfAttendees">No Of Attendees</label>
        <input type="integer" id="noOfAttendees" name="noOfAttendees" placeholder="Optional">
      </div>

      <button type="submit" id="submitBtn">Send RSVP</button>
    </form>

    <div id="statusMessage"></div>
  </div>

  <script>
    // Music Player Logic
    const musicPlayer = document.getElementById('musicPlayer');
    const bgMusic = document.getElementById('bgMusic');
    const musicText = document.getElementById('musicText');
    const playIcon = document.getElementById('playIcon');
    let isPlaying = false;

    musicPlayer.addEventListener('click', function() {
      if (!isPlaying) {
        bgMusic.play().then(() => {
          isPlaying = true;
          musicText.innerText = "Pause Music";
          playIcon.innerText = "⏸️";
        }).catch(error => {
          console.log("Playback blocked:", error);
        });
      } else {
        bgMusic.pause();
        isPlaying = false;
        musicText.innerText = "Play Music";
        playIcon.innerText = "🎵";
      }
    });
    
    // REPLACE THIS WITH YOUR DEPLOYED GOOGLE APPS SCRIPT URL
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwuaxJir8ML0VCe-LEHDy2SxWCwOiFinlWRlNmdJS4abibpNTKrv1esqr_jHy5rIAdT/exec";

    const form = document.getElementById('rsvpForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusMessage = document.getElementById('statusMessage');

    form.addEventListener('submit', function(e) {
      e.preventDefault();

      submitBtn.disabled = true;
      submitBtn.innerText = "Sending...";
      statusMessage.innerText = "";

      const payload = {
        name: document.getElementById('name').value,
        attending: document.getElementById('attending').value,
        noOfAttendees: document.getElementById('noOfAttendees').value
      };

      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors', // Bypasses CORS restrictions for Google Apps Script
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(payload)
      })
      .then(() => {
        statusMessage.style.color = "green";
        statusMessage.innerText = "Thank you! Your RSVP has been received.";
        form.reset();
      })
      .catch(error => {
        statusMessage.style.color = "red";
        statusMessage.innerText = "Something went wrong. Please try again.";
        console.error('Error:', error);
      })
      .finally(() => {
        submitBtn.disabled = false;
        submitBtn.innerText = "Send RSVP";
      });
    });
  </script>

</body>
</html>
