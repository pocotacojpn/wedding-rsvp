<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wedding RSVP</title>
  <!-- ====================EXTERNAL STYLESHEET (CSS)========================= -->
  <link rel="stylesheet" href="style.css">
  <!-- ====================================================================== -->
</head>
  
<body>

  <object data="pages/page2.html" width="100%" style="border:none; min-height: 100vh;"></object>
  
  <!-- Floating Music Toggle Button -->
  <div id="musicPlayer">
    <span id="playIcon">🎵</span>
    <span id="musicText">Play Music</span>
  </div>

  <!-- Hidden Audio Element linked to GitHub Raw File -->
  <audio id="bgMusic" autoplay loop>
    <source src="https://raw.githubusercontent.com/pocotacojpn/wedding-rsvp/refs/heads/main/wedding_1.mp3" type="audio/mp3">
    Your browser does not support the audio element.
  </audio>

  <div class="container">
    <h1>Celebration of Love</h1>
    <p class="subtitle">Please RSVP by filling out the form below</p>

    <form id="rsvpForm">
      <div class="form-group">
        <label for="name">Your Full Name</label>
        <input type="text" id="name" name="name" required placeholder="e.g. Jane Doe">
      </div>

      <div class="form-group">
        <label for="attending">Will you be attending?</label>
        <select id="attending" name="attending" required>
          <option value="">-- Please Select --</option>
          <option value="Yes">Joyfully Accepts</option>
          <option value="No">Regretfully Declines</option>
        </select>
      </div>

      <div class="form-group">
        <label for="noOfAttendees">No Of Attendees</label>
        <input type="integer" id="noOfAttendees" name="noOfAttendees" placeholder="Optional">
      </div>

      <button type="submit" id="submitBtn">Send RSVP</button>
    </form>
    
    <div id="statusMessage"></div>
  </div>

  
  <!-- ===================EXTERNAL JAVASCRIPT (SCRIPT)======================= -->
  <script src="script.js"></script>
  <!-- ====================================================================== -->
</body>
  
</html>
