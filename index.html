<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wedding RSVP</title>
  <style>
    body {
      font-family: 'Georgia', serif;
      background-color: #f9f6f0;
      color: #333;
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }
    .container {
      background: #ffffff;
      padding: 30px 40px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      max-width: 450px;
      width: 100%;
    }
    h1 {
      text-align: center;
      color: #5a4b41;
      margin-bottom: 8px;
    }
    p.subtitle {
      text-align: center;
      font-style: italic;
      color: #777;
      margin-bottom: 25px;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }
    input[type="text"], select, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      background-color: #8a9a86;
      color: white;
      border: none;
      padding: 12px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover {
      background-color: #73836f;
    }
    #statusMessage {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Celebration of Love</h1>
    <p class="subtitle">Please RSVP by filling out the form below</p>

  <div style="display: none;">
    <audio autoplay loop>
      <source src="https://raw.githubusercontent.com/YOUR_USERNAME/YOUR_REPO/main/wedding-song.mp3" type="audio/mpeg">
    </audio>
  </div>

    <form id="rsvpForm">
      <div class="form-group">
        <label for="name">Your Full Name</label>
        <input type="text" id="name" name="name" required placeholder="e.g. Jane Doe">
      </div>

      <div class="form-group">
        <label for="attending">Will you be attending?</label>
        <select id="attending" name="attending" required>
          <option value="">-- Please Select --</option>
          <option value="Yes">Joyfully Accepts</option>
          <option value="No">Regretfully Declines</option>
        </select>
      </div>

      <div class="form-group">
        <label for="noOfAttendees">No Of Attendees</label>
        <input type="integer" id="noOfAttendees" name="noOfAttendees" placeholder="Optional">
      </div>

      <button type="submit" id="submitBtn">Send RSVP</button>
    </form>

    <div id="statusMessage"></div>
  </div>

  <script>
    // REPLACE THIS WITH YOUR DEPLOYED GOOGLE APPS SCRIPT URL
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwuaxJir8ML0VCe-LEHDy2SxWCwOiFinlWRlNmdJS4abibpNTKrv1esqr_jHy5rIAdT/exec";

    const form = document.getElementById('rsvpForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusMessage = document.getElementById('statusMessage');

    form.addEventListener('submit', function(e) {
      e.preventDefault();

      submitBtn.disabled = true;
      submitBtn.innerText = "Sending...";
      statusMessage.innerText = "";

      const payload = {
        name: document.getElementById('name').value,
        attending: document.getElementById('attending').value,
        noOfAttendees: document.getElementById('noOfAttendees').value
      };

      fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors', // Bypasses CORS restrictions for Google Apps Script
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(payload)
      })
      .then(() => {
        statusMessage.style.color = "green";
        statusMessage.innerText = "Thank you! Your RSVP has been received.";
        form.reset();
      })
      .catch(error => {
        statusMessage.style.color = "red";
        statusMessage.innerText = "Something went wrong. Please try again.";
        console.error('Error:', error);
      })
      .finally(() => {
        submitBtn.disabled = false;
        submitBtn.innerText = "Send RSVP";
      });
    });
  </script>

</body>
</html>
